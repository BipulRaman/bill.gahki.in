<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icon: full-bleed background + centered glyph inside the
       80% safe-zone (Android adaptive icons crop to ~circle/squircle). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7cf5c8"/>
      <stop offset="100%" stop-color="#4ea0ff"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Glyph centered in the 80% safe zone (51px..461px) -->
  <g transform="translate(102 102) scale(9.6875)">
    <!-- Same lightning-bolt mark as favicon, scaled to 32x32 grid -->
    <path fill="url(#mark)"
          d="M17.95 31.957c-.443.564-1.347.25-1.347-.466V22.625a1.51 1.51 0 0 0-1.508-1.508H6.857c-.614 0-.971-.694-.614-1.192l4.987-6.98c.713-1 0-2.386-1.228-2.386H.825c-.614 0-.971-.694-.614-1.192L6.675.316A.79.79 0 0 1 7.288 0h19.262c.614 0 .971.694.614 1.192l-4.987 6.98c-.713 1 0 2.386 1.228 2.386h7.585c.629 0 .982.726.594 1.221L17.95 31.96z"/>
  </g>
</svg>
